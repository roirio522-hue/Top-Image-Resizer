<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">

      function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Images Resizer Pro | Professional Bulk Photo Tool</title>
    <meta name="description" content="Images Resizer Pro: Free online bulk image resizer. Resize multiple photos and convert to JPG, PNG, or WebP instantly.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader {
            width: 35px; height: 35px; border: 4px solid #334155; border-top: 4px solid #3b82f6;
            border-radius: 50%; animation: spin 1s linear infinite; display: none; margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .preview-card img { 
            max-height: 150px; border: 2px solid #3b82f6; border-radius: 10px; 
            margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-card w-full max-w-xl p-8 rounded-[2.5rem] shadow-2xl my-10">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400 italic uppercase">Images Resizer Pro</h1>
            <p class="text-slate-400 text-xs tracking-widest uppercase mt-1">Multi-Image & Format Support</p>
        </div>

        <div id="uploadContainer" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-500/5 transition-all mb-6">
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
            <div id="uploadPrompt">
                <i class="fas fa-images text-4xl text-blue-500 mb-3"></i>
                <p class="text-slate-300 font-semibold">Select One or Multiple Photos</p>
            </div>
            <div id="uploadLoader" class="loader"></div>
            <p id="uploadStatus" class="hidden text-green-400 font-bold mt-2 uppercase text-sm"></p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Width (px)</label>
                <input type="number" id="widthInput" placeholder="1080" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl focus:outline-none focus:border-blue-500 mt-1 text-white">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Height (px)</label>
                <input type="number" id="heightInput" placeholder="1080" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl focus:outline-none focus:border-blue-500 mt-1 text-white">
            </div>
        </div>

        <div class="mb-6">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-1">Convert To Format</label>
            <select id="formatSelect" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl focus:outline-none focus:border-blue-500 mt-1 text-white">
                <option value="png">PNG (Lossless)</option>
                <option value="jpeg">JPG (Small Size)</option>
                <option value="webp">WebP (Next-Gen)</option>
            </select>
        </div>

        <button onclick="processImages()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg transition-all active:scale-95 uppercase">
            Process All Images
        </button>

        <div id="finalSection" class="hidden border-t border-slate-700 mt-8 pt-6">
            <p class="text-center text-xs text-blue-400 mb-6 font-bold uppercase tracking-widest italic">Ready for Download</p>
            <div id="bulkContainer" class="grid grid-cols-1 gap-6"></div>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadContainer = document.getElementById('uploadContainer');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const uploadLoader = document.getElementById('uploadLoader');
        const uploadStatus = document.getElementById('uploadStatus');
        const finalSection = document.getElementById('finalSection');
        const bulkContainer = document.getElementById('bulkContainer');

        uploadContainer.onclick = () => imageInput.click();

        imageInput.onchange = function() {
            const count = this.files.length;
            if (count > 0) {
                uploadPrompt.classList.add('hidden');
                uploadLoader.style.display = 'block';
                uploadStatus.classList.add('hidden');
                setTimeout(() => {
                    uploadLoader.style.display = 'none';
                    uploadStatus.innerText = `${count} Image(s) Selected`;
                    uploadStatus.classList.remove('hidden');
                }, 800); 
            }
        };

        async function processImages() {
            const files = imageInput.files;
            const w = document.getElementById('widthInput').value;
            const h = document.getElementById('heightInput').value;
            const format = document.getElementById('formatSelect').value;

            if (files.length === 0 || !w || !h) { 
                alert("Please select images and enter dimensions!"); 
                return; 
            }

            bulkContainer.innerHTML = ''; 
            finalSection.classList.remove('hidden');

            for (let file of files) {
                const dataUrl = await resizeImage(file, w, h, format);
                createPreviewCard(dataUrl, file.name, format);
            }
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function resizeImage(file, w, h, format) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = w;
                        canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL(`image/${format === 'jpeg' ? 'jpeg' : format}`));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function createPreviewCard(url, name, format) {
            const extension = format === 'jpeg' ? 'jpg' : format;
            const card = document.createElement('div');
            card.className = "preview-card bg-slate-800/50 p-4 rounded-2xl text-center border border-slate-700";
            card.innerHTML = `
                <div class="mb-3 flex justify-center"><img src="${url}"></div>
                <p class="text-[10px] text-slate-400 truncate mb-3 px-2">${name}</p>
                <a href="${url}" download="Resized_${name.split('.')[0]}.${extension}" 
                   class="inline-block w-full bg-green-500 hover:bg-green-400 text-white font-bold py-2 px-4 rounded-lg text-sm transition-all">
                   <i class="fas fa-download mr-1"></i> DOWNLOAD ${extension.toUpperCase()}
                </a>
            `;
            bulkContainer.appendChild(card);
        }
    </script>
</body>
</html>
